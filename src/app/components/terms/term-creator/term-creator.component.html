<div class="term-creator-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <button mat-icon-button (click)="cancel()" class="back-button">
          <mat-icon>arrow_back</mat-icon>
        </button>
        Create New Term
      </mat-card-title>
      <mat-card-subtitle>Define a new term for use in scoring and ballots</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="termForm">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Term Name</mat-label>
          <input matInput formControlName="name" placeholder="e.g., Unemployment Rate" required>
          <mat-hint>A clear, descriptive name for the term</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="4"
                    placeholder="Describe what this term measures or represents"></textarea>
          <mat-hint>Optional detailed description</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Source</mat-label>
          <input matInput formControlName="source"
                 placeholder="e.g., Bureau of Labor Statistics">
          <mat-hint>Where the data comes from</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Category</mat-label>
          <input matInput formControlName="category" placeholder="e.g., Economic, Social">
          <mat-hint>Optional category for organization</mat-hint>
        </mat-form-field>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <button mat-button (click)="cancel()">Cancel</button>
      <button mat-raised-button color="primary"
              (click)="createTerm()"
              [disabled]="loading || !termForm.valid">
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        <span *ngIf="!loading">Create Term</span>
      </button>
    </mat-card-actions>
  </mat-card>
</div>
