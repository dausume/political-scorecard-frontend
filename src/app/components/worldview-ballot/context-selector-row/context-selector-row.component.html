<div class="context-selector-row">
  <div class="context-left">
    <div class="context-items">
      <div class="context-item">
        <label class="context-label" for="timeframe-selector">Timeframe:</label>
        <select
          id="timeframe-selector"
          class="context-dropdown"
          [(ngModel)]="selectedTimeframe"
          (ngModelChange)="onTimeframeChange($event)">
          <option value="">Select timeframe...</option>
          @for (option of timeframeOptions; track option.label) {
            <option [value]="option.label">{{ option.label }}</option>
          }
        </select>
      </div>

      <div class="context-item">
        <label class="context-label" for="location-selector">Location:</label>
        <select
          id="location-selector"
          class="context-dropdown"
          [(ngModel)]="selectedLocation"
          (ngModelChange)="onLocationChange($event)">
          <option value="">Select location...</option>
          @for (option of locationOptions; track option.label) {
            <option [value]="option.label">{{ option.label }}</option>
          }
        </select>
      </div>
    </div>
  </div>

  <!-- Per-context score chips retired 2026-07-17: scoring moved to the Worldview Scorer. -->
  @if (isCore) {
    <div class="context-score no-data">
      <div class="no-data-message">
        Scoring moved to the Worldview Scorer
      </div>
    </div>
  }
</div>
